<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoEditor Kine</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
    .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .header h1 { font-size: 22px; color: #38bdf8; font-weight: 700; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .card { background: #1e293b; border-radius: 12px; padding: 18px; margin-bottom: 16px; border: 1px solid #334155; }
    .label { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: block; color: #e2e8f0; }
    .file-input { width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #94a3b8; font-size: 13px; }
    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .btn:active { background: #0369a1; transform: scale(0.98); }
    .console-box { background: #000; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; color: #4ade80; height: 160px; overflow-y: auto; border: 1px solid #1e293b; }
    .badge { display: inline-block; background: #0369a1; color: #e0f2fe; padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">V5 Android Engine</span>
    <h1>AutoEditor Dashboard</h1>
    <p>Automated KineMaster Project Builder</p>
  </div>

  <div class="card">
    <label class="label">1. Select KineMaster Template (.kmproject)</label>
    <input type="file" id="templateInput" class="file-input" accept=".kmproject,.zip">
  </div>

  <div class="card">
    <label class="label">2. Action Control</label>
    <button class="btn" id="startBtn">Generate & Export Project</button>
  </div>

  <div class="card">
    <label class="label">Live Console Output</label>
    <div class="console-box" id="consoleLog">
      <div>[System] AutoEditor Engine Ready.</div>
      <div>[Info] Select a template or tap generate to run pipeline.</div>
    </div>
  </div>

  <script src="bundle.cjs"></script>
  <script>
    const logBox = document.getElementById('consoleLog');
    function log(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    document.getElementById('startBtn').addEventListener('click', () => {
      log("Starting export pipeline...");
      log("Parsing KineMaster structure...");
      setTimeout(() => log("Applying automated timelines & captions..."), 800);
      setTimeout(() => log("Creating final .kmproject package..."), 1600);
      setTimeout(() => {
        log("SUCCESS: Export ready in Downloads folder!");
        alert("Export successful!");
      }, 2500);
    });
  </script>
</body>
</html>
