<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoEditor V5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 18px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #38bdf8; font-weight: 700; }
    .badge { display: inline-block; background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 8px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    .label { font-size: 14px; font-weight: 600; margin-bottom: 6px; display: block; color: #cbd5e1; }
    .sub { font-size: 12px; color: #94a3b8; margin-bottom: 10px; display: block; }
    .file-input { width: 100%; padding: 12px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #94a3b8; font-size: 13px; }
    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:active { background: #0369a1; }
    .detected-list { margin-top: 10px; max-height: 120px; overflow-y: auto; font-size: 12px; color: #94a3b8; }
    .detected-item { padding: 4px 0; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; }
    .dur-badge { color: #38bdf8; font-weight: 600; }
    .console-box { background: #000; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #4ade80; height: 160px; overflow-y: auto; border: 1px solid #1e293b; margin-top: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">Fully Automated Engine</span>
    <h1>AutoEditor Dashboard</h1>
  </div>

  <div class="card">
    <label class="label">Select Scene Images</label>
    <span class="sub">Filenames se duration khud-ba-khud extract hogi (e.g. 0-05.jpg, 1-15_scene.png)</span>
    <input type="file" id="imageFiles" class="file-input" multiple accept="image/*">
    <div id="detectedFiles" class="detected-list"></div>
  </div>

  <button class="btn" id="exportBtn">⚡ Auto-Generate KineMaster Project</button>

  <div class="console-box" id="logBox">
    <div>[System] AutoEditor Filename-Parser Ready.</div>
    <div>[Ready] Images select karein, duration automatic calculate ho jayegi.</div>
  </div>

  <script src="app-engine.js"></script>
  <script>
    const logBox = document.getElementById('logBox');
    function log(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function fileToUint8(file) {
      const buf = await file.arrayBuffer();
      return new Uint8Array(buf);
    }

    const imgInput = document.getElementById('imageFiles');
    const detectedDiv = document.getElementById('detectedFiles');

    imgInput.addEventListener('change', () => {
      detectedDiv.innerHTML = '';
      if (!imgInput.files || imgInput.files.length === 0) return;
      log(`${imgInput.files.length} images detect hui.`);
      for (const f of imgInput.files) {
        const d = parseFilenameDuration(f.name);
        const item = document.createElement('div');
        item.className = 'detected-item';
        item.innerHTML = `<span>${f.name}</span><span class="dur-badge">${d ? d + 's (from name)' : '3s (default)'}</span>`;
        detectedDiv.appendChild(item);
      }
    });

    document.getElementById('exportBtn').addEventListener('click', async () => {
      try {
        if (!imgInput.files || imgInput.files.length < 2) {
          alert("Kam se kam 2 images select karein!");
          return;
        }

        log(`Auto pipeline start: ${imgInput.files.length} images processing...`);

        const res = await fetch(imgInput.files.length === 2 ? 'kine-template-2.kmproject' : 'kine-template.kmproject');
        if (!res.ok) throw new Error("Bundled KineMaster template load nahi ho paya.");
        const template = new Uint8Array(await res.arrayBuffer());

        const ftrx = indexOfSubarray(template, new TextEncoder().encode('FTRX'));
        if (ftrx < 0) throw new Error("KineMaster FTRX boundary missing.");

        let chunkStart = -1;
        const view = new DataView(template.buffer, template.byteOffset, template.byteLength);
        for (let p = Math.max(0, ftrx - 10000); p <= ftrx - 4; p++) {
          const n = view.getUint32(p, false);
          if (n === ftrx - (p + 4)) { chunkStart = p; break; }
        }
        if (chunkStart < 0 || template[chunkStart + 4] !== 0x0a)
          throw new Error("KineMaster chunk boundary error.");

        const chunk = template.slice(chunkStart + 4, ftrx);
        const records = parseTopLevelRecords(chunk);
        const pairRecords = records.filter(r => r.field === 1 && r.wire === 2);

        const clip0 = chunk.slice(pairRecords[0].start, pairRecords[0].end);
        const meta0 = chunk.slice(pairRecords[1].start, pairRecords[1].end);
        const clip1 = chunk.slice(pairRecords[2].start, pairRecords[2].end);
        const meta1 = chunk.slice(pairRecords[3].start, pairRecords[3].end);
        const clip2 = imgInput.files.length >= 3 ? chunk.slice(pairRecords[4].start, pairRecords[4].end) : null;
        const meta2 = imgInput.files.length >= 3 ? chunk.slice(pairRecords[5].start, pairRecords[5].end) : null;

        const templateInternalNames = imgInput.files.length === 2
          ? ['79_20260930101542.jpg', '81_20260930101541.jpg']
          : ['79_20260930101542.jpg', '81_20260930101541.jpg', '82_20261005000002.jpg'];

        const groups = [], metas = [], assets = [];

        for (let i = 0; i < imgInput.files.length; i++) {
          const file = imgInput.files[i];
          const baseClip = i === 0 ? clip0 : (i === 1 ? clip1 : clip2);
          const baseMeta = i === 0 ? meta0 : (i === 1 ? meta1 : meta2);
          const baseDur = i === 0 ? 5000 : (i === 1 ? 10000 : 5000);
          const internal = i < 3 ? templateInternalNames[i] : makeInternalName(i);

          const autoSec = parseFilenameDuration(file.name) || 3;
          const g = new Uint8Array(baseClip);
          patchDuration(g, baseDur, Math.round(autoSec * 1000), DURATION_OFFSETS[Math.min(i, 2)]);
          patchAssetReference(g, templateInternalNames[Math.min(i, 2)], internal);

          if (i >= 3) {
            const id1 = readInnerVarintField(g, 1);
            const id2 = readInnerVarintField(g, 2);
            patchInnerVarintField(g, 1, id1 + BigInt(i));
            patchInnerVarintField(g, 2, id2 + BigInt(i));
          }

          const m = new Uint8Array(baseMeta);
          if (i >= 3) {
            const id1 = readInnerVarintField(m, 1);
            const id2 = readInnerVarintField(m, 2);
            patchInnerVarintField(m, 1, id1 + BigInt(i * 1000));
            patchInnerVarintField(m, 2, id2 + BigInt(i * 1000));
          }

          groups.push(g); metas.push(m);
          assets.push({ name: internal, data: await fileToUint8(file) });
          log(`[Auto-Timeline] ${file.name} -> ${autoSec}s`);
        }

        const globalOffset = records.find(r => r.field === 100)?.start;
        const allPairs = [];
        for (let i = 0; i < imgInput.files.length; i++) allPairs.push(groups[i], metas[i]);

        const pairData = concatUint8(allPairs);
        const newChunk = concatUint8([pairData, chunk.slice(globalOffset)]);

        const finalProject = concatUint8([
          template.slice(0, chunkStart),
          u32BE(newChunk.length),
          newChunk,
          template.slice(ftrx)
        ]);

        const projectName = `${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.kmproject`;
        const entries = [{ name: projectName, data: finalProject }, ...assets.map(a => ({ name: `contents/${a.name}`, data: a.data }))];

        log("Generating KineMaster file...");
        const zipData = makeZip(entries);

        const blob = new Blob([zipData], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `autoeditor-${Date.now()}.kine`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        log("SUCCESS: KineMaster project ready!");
      } catch (err) {
        log(`ERROR: ${err.message}`);
        alert(`Error: ${err.message}`);
      }
    });
  </script>
</body>
</html>
