<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoEditor V5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b1329; color: #f8fafc; padding: 18px; }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 20px; color: #38bdf8; font-weight: 700; }
    .badge { display: inline-block; background: #0284c7; color: #fff; padding: 3px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 8px; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
    .label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; color: #cbd5e1; }
    .sub { font-size: 11px; color: #94a3b8; margin-bottom: 8px; display: block; }
    .file-input { width: 100%; padding: 10px; background: #0f172a; border: 1px dashed #475569; border-radius: 8px; color: #94a3b8; font-size: 13px; }
    .num-input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 6px; }
    .btn { width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
    .btn:active { background: #0369a1; }
    .console-box { background: #000; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #4ade80; height: 160px; overflow-y: auto; border: 1px solid #1e293b; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <span class="badge">V5 KineMaster Core Engine</span>
    <h1>AutoEditor Dashboard</h1>
  </div>

  <div class="card">
    <label class="label">1. Select Images (Min. 2)</label>
    <span class="sub">PNG, JPG, WEBP select karein</span>
    <input type="file" id="imageFiles" class="file-input" multiple accept="image/*">
  </div>

  <div class="card">
    <label class="label">2. Default Clip Duration (Seconds)</label>
    <input type="number" id="defaultDur" class="num-input" value="3" min="1" max="15">
  </div>

  <div class="card">
    <label class="label">3. Optional: Custom Template (.kmproject)</label>
    <span class="sub">Agar blank chhodenge to bundled template use hoga</span>
    <input type="file" id="templateFile" class="file-input" accept=".kmproject">
  </div>

  <button class="btn" id="exportBtn">Export KineMaster Project</button>

  <div class="console-box" id="logBox">
    <div>[System] AutoEditor Engine Active.</div>
    <div>[Ready] Select images to begin.</div>
  </div>

  <script src="app-engine.js"></script>
  <script>
    const logBox = document.getElementById('logBox');
    function log(msg) {
      const line = document.createElement('div');
      line.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function fileToUint8(file) {
      const buf = await file.arrayBuffer();
      return new Uint8Array(buf);
    }

    document.getElementById('exportBtn').addEventListener('click', async () => {
      try {
        const imgInput = document.getElementById('imageFiles');
        if (!imgInput.files || imgInput.files.length < 2) {
          alert("KineMaster export ke liye kam se kam 2 images select karein!");
          return;
        }

        log(`Images loaded: ${imgInput.files.length}`);
        const defaultDur = parseFloat(document.getElementById('defaultDur').value) || 3;

        let templateBuf;
        const customTemplate = document.getElementById('templateFile').files[0];
        if (customTemplate) {
          log("Using custom uploaded template...");
          templateBuf = await fileToUint8(customTemplate);
        } else {
          log("Fetching bundled template...");
          const res = await fetch(imgInput.files.length === 2 ? 'kine-template-2.kmproject' : 'kine-template.kmproject');
          if (!res.ok) throw new Error("Bundled template file nahi mila. Template browse karke select karein.");
          const arrayBuffer = await res.arrayBuffer();
          templateBuf = new Uint8Array(arrayBuffer);
        }

        log("Processing timeline binary patch...");
        const template = templateBuf;
        const ftrx = indexOfSubarray(template, new TextEncoder().encode('FTRX'));
        if (ftrx < 0) throw new Error("Verified KineMaster FTRX boundary not found.");

        let chunkStart = -1;
        const view = new DataView(template.buffer, template.byteOffset, template.byteLength);
        for (let p = Math.max(0, ftrx - 10000); p <= ftrx - 4; p++) {
          const n = view.getUint32(p, false);
          if (n === ftrx - (p + 4)) { chunkStart = p; break; }
        }
        if (chunkStart < 0 || template[chunkStart + 4] !== 0x0a)
          throw new Error("Verified KineMaster chunk boundary failed.");

        const chunk = template.slice(chunkStart + 4, ftrx);
        const records = parseTopLevelRecords(chunk);
        const pairRecords = records.filter(r => r.field === 1 && r.wire === 2);

        const clip0 = chunk.slice(pairRecords[0].start, pairRecords[0].end);
        const meta0 = chunk.slice(pairRecords[1].start, pairRecords[1].end);
        const clip1 = chunk.slice(pairRecords[2].start, pairRecords[2].end);
        const meta1 = chunk.slice(pairRecords[3].start, pairRecords[3].end);
        const clip2 = imgInput.files.length >= 3 ? chunk.slice(pairRecords[4].start, pairRecords[4].end) : null;
        const meta2 = imgInput.files.length >= 3 ? chunk.slice(pairRecords[5].start, pairRecords[5].end) : null;

        const templateInternalNames = imgInput.files.length === 2
          ? ['79_20260930101542.jpg', '81_20260930101541.jpg']
          : ['79_20260930101542.jpg', '81_20260930101541.jpg', '82_20261005000002.jpg'];

        const groups = [], metas = [], assets = [];

        for (let i = 0; i < imgInput.files.length; i++) {
          const file = imgInput.files[i];
          const baseClip = i === 0 ? clip0 : (i === 1 ? clip1 : clip2);
          const baseMeta = i === 0 ? meta0 : (i === 1 ? meta1 : meta2);
          const baseDur = i === 0 ? 5000 : (i === 1 ? 10000 : 5000);
          const internal = i < 3 ? templateInternalNames[i] : makeInternalName(i);

          const g = new Uint8Array(baseClip);
          const customSec = parseFilenameDuration(file.name) || defaultDur;
          patchDuration(g, baseDur, Math.round(customSec * 1000), DURATION_OFFSETS[Math.min(i, 2)]);
          patchAssetReference(g, templateInternalNames[Math.min(i, 2)], internal);

          if (i >= 3) {
            const id1 = readInnerVarintField(g, 1);
            const id2 = readInnerVarintField(g, 2);
            patchInnerVarintField(g, 1, id1 + BigInt(i));
            patchInnerVarintField(g, 2, id2 + BigInt(i));
          }

          const m = new Uint8Array(baseMeta);
          if (i >= 3) {
            const id1 = readInnerVarintField(m, 1);
            const id2 = readInnerVarintField(m, 2);
            patchInnerVarintField(m, 1, id1 + BigInt(i * 1000));
            patchInnerVarintField(m, 2, id2 + BigInt(i * 1000));
          }

          groups.push(g); metas.push(m);
          assets.push({ name: internal, data: await fileToUint8(file) });
          log(`Packed clip #${i + 1}: ${file.name} (${customSec}s)`);
        }

        const globalOffset = records.find(r => r.field === 100)?.start;
        const allPairs = [];
        for (let i = 0; i < imgInput.files.length; i++) allPairs.push(groups[i], metas[i]);

        const pairData = concatUint8(allPairs);
        const newChunk = concatUint8([pairData, chunk.slice(globalOffset)]);

        const finalProject = concatUint8([
          template.slice(0, chunkStart),
          u32BE(newChunk.length),
          newChunk,
          template.slice(ftrx)
        ]);

        const projectName = `${new Date().toISOString().slice(0, 10).replace(/-/g, '')}.kmproject`;
        const entries = [{ name: projectName, data: finalProject }, ...assets.map(a => ({ name: `contents/${a.name}`, data: a.data }))];

        log("Zipping project package...");
        const zipData = makeZip(entries);

        const blob = new Blob([zipData], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `autoeditor-kine-${Date.now()}.kine`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        log("COMPLETE: File downloaded successfully!");
        alert("Export Complete! File downloaded to your phone.");
      } catch (err) {
        log(`ERROR: ${err.message}`);
        alert(`Error: ${err.message}`);
      }
    });
  </script>
</body>
</html>
