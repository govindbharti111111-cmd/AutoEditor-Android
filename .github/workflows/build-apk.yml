name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Web Assets
      run: |
        mkdir -p www
        cp -r * www/ 2>/dev/null || true
        rm -rf www/www www/.git www/.github
        # Ensure index.html exists
        if [ ! -f www/index.html ]; then
          MAIN_HTML=$(find www -maxdepth 1 -name "*.html" | head -n 1)
          if [ -n "$MAIN_HTML" ]; then
            cp "$MAIN_HTML" www/index.html
          else
            echo '<!DOCTYPE html><html><head><title>AutoEditor</title></head><body><h1>AutoEditor Running</h1><script src="kine-export.js"></script></body></html>' > www/index.html
          fi
        fi

    - name: Install Dependencies & Setup Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android
        npx cap init AutoEditor com.autoeditor.kine --web-dir www
        npx cap add android

    - name: Build Android APK
      run: |
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK File
      uses: actions/upload-artifact@v4
      with:
        name: AutoEditor-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk
